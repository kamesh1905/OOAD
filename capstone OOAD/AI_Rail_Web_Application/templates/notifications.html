{% extends "base.html" %}{% block content %}<div class="sectionhead"><div><div class="eyebrow">Passenger updates</div><h2>Notifications</h2></div></div>{% for n in notifications %}<div class="card" style="margin-bottom:12px"><span class="pill">{{ n.kind }}</span><p>{{ n.message }}</p><small class="muted">{{ n.created_at }} · {{ n.status }}</small></div>{% else %}<div class="panel empty">No notifications yet.</div>{% endfor %}{% endblock %}
